# Fond d'écran derrière nvim : voir ~/.config/nvim/lua/config/fond.lua
# (inclus depuis ~/.config/kitty/kitty.conf).

# nvim demande à kitty d'afficher l'image quand il s'ouvre et de l'enlever
# quand il se ferme : il faut le contrôle à distance. Le socket est dans
# /run/user/<ton uid>, que les autres comptes ne peuvent pas ouvrir.
allow_remote_control socket-only
listen_on unix:${XDG_RUNTIME_DIR}/kitty

# l'image remplit la fenêtre sans être déformée, et reste nette
background_image_layout cscaled
background_image_linear yes

# assombrit l'image pour que le texte reste lisible
# (0 = image brute, 1 = noir complet ; ne change rien sans image)
background_tint 0.8
